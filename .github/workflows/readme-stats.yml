name: Generate readme stats cards

"on":
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub overview stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&rank_icon=github&hide_border=true&disable_animations=true&bg_color=0B1018&title_color=22D3EE&icon_color=A3E635&text_color=CBD5E1&ring_color=A3E635&border_color=243447
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&disable_animations=true&bg_color=0B1018&title_color=22D3EE&text_color=CBD5E1&border_color=243447
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "chore: update readme stats cards"
          add: "profile"
