name: Generate 3D contribution graph

"on":
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/profile-3d-contrib.json

      - name: Commit updated graph
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "chore: update 3D contribution graph"
          add: "profile-3d-contrib"
