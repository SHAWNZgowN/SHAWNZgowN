name: Generate contribution snake

"on":
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%2384CC16&color_dots=%23F1F5F9,%23A5F3FC,%2367E8F9,%2322D3EE,%230E7490
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23A3E635&color_dots=%23111925,%230E7490,%230891B2,%2322D3EE,%2367E8F9

      - name: Commit updated animation
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "chore: update contribution snake"
          add: "dist"
