<svg width="900" height="12" viewBox="0 0 900 12" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Brand separator">
  <defs>
    <linearGradient id="brand" x1="0" y1="6" x2="900" y2="6" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="0.22" stop-color="#22D3EE" />
      <stop offset="0.5" stop-color="#A3E635" />
      <stop offset="0.78" stop-color="#22D3EE" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC" stop-opacity="0" />
      <stop offset="0.5" stop-color="#F8FAFC" stop-opacity="0.85" />
      <stop offset="1" stop-color="#F8FAFC" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    .shine { animation: slide 4.8s linear infinite; transform-box: fill-box; }
    @keyframes slide {
      from { transform: translateX(-160px); }
      to { transform: translateX(900px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .shine { animation: none !important; opacity: 0; }
    }
  </style>
  <rect y="5" width="900" height="2" rx="1" fill="url(#brand)" />
  <rect class="shine" x="0" y="4" width="150" height="4" rx="2" fill="url(#shine)" />
  <circle cx="450" cy="6" r="5" fill="#0B1018" stroke="#A3E635" stroke-width="2" />
  <circle cx="450" cy="6" r="1.5" fill="#22D3EE" />
</svg>
