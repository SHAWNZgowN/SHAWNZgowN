<svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Status indicator">
  <style>
    .ring { fill: none; stroke: #A3E635; stroke-width: 1.6; transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    .core { fill: #A3E635; }
    @keyframes pulse {
      0% { transform: scale(0.35); opacity: 0.9; }
      100% { transform: scale(1.7); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ring { animation: none !important; opacity: 0.35; }
    }
  </style>
  <circle class="ring" cx="9" cy="9" r="6" />
  <circle class="core" cx="9" cy="9" r="3.4" />
</svg>
