<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 840 48'
    style='background-color: #00000000;'
    width='840px' height='48px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}

    /* Brand palette - theme aware: lime / cyan / neutral */
    .l1 { fill: #4D7C0F; }
    .l2 { fill: #0E7490; }
    .l3 { fill: #0B1018; }
    @media (prefers-color-scheme: dark) {
      .l1 { fill: #A3E635; }
      .l2 { fill: #22D3EE; }
      .l3 { fill: #F8FAFC; }
    }
</style>

                    <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d2.end'
                    dur='4200ms' fill='remove'
                    values='m0,24 h0 ; m0,24 h840 ; m0,24 h840 ; m0,24 h0' keyTimes='0;0.57142857142857;0.85714285714286;1' />
                    </path>
    <text font-family='"Fira Code", monospace' class='l1' font-size='30'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Hi there, I&#039;m Shawn Harvey Otero!
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='4200ms' fill='remove'
                    values='m0,24 h0 ; m0,24 h840 ; m0,24 h840 ; m0,24 h0' keyTimes='0;0.57142857142857;0.85714285714286;1' />
                    </path>
    <text font-family='"Fira Code", monospace' class='l2' font-size='30'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            github.com/SHAWNZgowN
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Single line -->
                                <animate id='d2' attributeName='d' begin='d1.end'
                    dur='4200ms' fill='remove'
                    values='m0,24 h0 ; m0,24 h840 ; m0,24 h840 ; m0,24 h0' keyTimes='0;0.57142857142857;0.85714285714286;1' />
                    </path>
    <text font-family='"Fira Code", monospace' class='l3' font-size='30'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            Full-Stack Web Developer
        </textPath>
    </text>
</svg>
